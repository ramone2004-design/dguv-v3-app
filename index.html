<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DGUV V3 Prüfungen</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' blob: data:; connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/ data:; frame-src https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b5cad">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DGUV V3">
<style>
  :root {
    --bg: #f3f5f8; --card: #ffffff; --text: #17202b; --muted: #627084;
    --line: #dde3ea; --accent: #0b5cad; --accent-text: #ffffff;
    --ok: #1a7f43; --ok-bg: #e2f4e8; --warn: #9a6200; --warn-bg: #fdf0d2;
    --bad: #b3261e; --bad-bg: #fbe3e1; --open: #556070; --open-bg: #e8ecf1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --card: #1c222b; --text: #e8edf3; --muted: #97a3b3;
      --line: #2e3742; --accent: #5aa6ee; --accent-text: #0c1520;
      --ok: #6fd093; --ok-bg: #173524; --warn: #f0c060; --warn-bg: #3b2f10;
      --bad: #ff8a80; --bad-bg: #44201d; --open: #aab4c2; --open-bg: #2a323d;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
  header.top { background: var(--card); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
  .brand { font-weight: 700; font-size: 18px; text-decoration: none; color: var(--text); flex: 1; }
  .brand span { color: var(--accent); }
  nav.crumbs { padding: 0 0 10px; font-size: 14px; color: var(--muted);
    display: flex; flex-wrap: wrap; gap: 4px 6px; }
  nav.crumbs a { color: var(--accent); text-decoration: none; }
  nav.crumbs a:hover { text-decoration: underline; }
  main { padding: 20px 0 120px; }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .bottom .wrap { display: flex; padding: 0 4px; }
  .bottom a { flex: 1; min-width: 0; text-align: center; padding: 8px 2px 9px; text-decoration: none;
    color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .bottom a .icon { display: block; font-size: 20px; }
  .bottom a.active { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card .label { color: var(--muted); font-size: 14px; }
  .card .big { font-size: 22px; font-weight: 700; }
  h2.sec { font-size: 18px; margin: 0; flex: 1; }
  .head.abstand { margin-top: 28px; }
  body.gesperrt #cloudBtn, body.gesperrt #lockBtn, body.gesperrt .bottom, body.gesperrt nav.crumbs { display: none; }
  .sperre { max-width: 420px; margin: 24px auto; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 24px 20px; text-align: center; }
  .sperre h1 { font-size: 22px; margin: 6px 0 8px; }
  .sperre form, .sperre label { text-align: left; }
  .sperre .schloss { font-size: 40px; }
  .sperre .sub { margin: 0 0 16px; }
  .sperre .klein { font-size: 13px; margin-top: 10px; }
  button.voll { width: 100%; }
  button.link { border: 0; background: none; color: var(--accent); padding: 4px; min-height: 0; font-size: 14px; }
  button.link:hover { text-decoration: underline; }
  .fehlertext { color: var(--bad); font-size: 14px; min-height: 20px; margin: -4px 0 10px; text-align: left; }
  .fehlertext:empty { min-height: 0; margin: 0; }
  label.haken { display: flex; gap: 10px; align-items: flex-start; color: var(--text); }
  label.haken input { width: auto; margin-top: 3px; flex-shrink: 0; }
  .dlg-actions.spalte { flex-direction: column; align-items: stretch; }
  #cloudBtn.ok { color: var(--ok); } #cloudBtn.fehler { color: var(--bad); } #cloudBtn.abgemeldet { color: var(--warn); }
  dialog details { font-size: 14px; margin-bottom: 14px; } dialog summary { cursor: pointer; color: var(--accent); }
  dialog ol { padding-left: 20px; margin: 8px 0 0; } dialog li { margin-bottom: 6px; }
  dialog code { background: var(--bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  dialog p.sub { margin: 0 0 14px; }
  .fotos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .fotos:empty { display: none; }
  button.thumb { padding: 0; width: 76px; height: 76px; min-height: 0; overflow: hidden; background: var(--bg); }
  button.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  dialog.breit { width: min(900px, calc(100vw - 32px)); }
  img.gross { display: block; max-width: 100%; max-height: 70vh; margin: 0 auto 14px; border-radius: 8px; }
  .erledigt .title { text-decoration: line-through; color: var(--muted); font-weight: 400; }
  .head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .head h1 { font-size: 24px; margin: 0; flex: 1; min-width: 200px; }
  .head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; flex-basis: 100%; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; min-height: 40px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--bad); }
  button.small { padding: 4px 10px; min-height: 32px; font-size: 14px; }
  .list { display: grid; gap: 10px; }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    display: flex; align-items: center; gap: 10px; padding: 4px 8px 4px 0; }
  .row a.main { flex: 1; min-width: 0; padding: 12px 16px; text-decoration: none; color: inherit; display: block; }
  .row div.main { flex: 1; min-width: 0; padding: 12px 16px; }
  .row:has(a.main:hover) { border-color: var(--accent); }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .badge { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
  .b-ok { color: var(--ok); background: var(--ok-bg); }
  .b-warn { color: var(--warn); background: var(--warn-bg); }
  .b-bad { color: var(--bad); background: var(--bad-bg); }
  .b-open { color: var(--open); background: var(--open-bg); }
  .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
    text-decoration: none; color: inherit; display: block; }
  .tile:hover { border-color: var(--accent); }
  .tile .icon { font-size: 28px; }
  .tile .count { font-size: 28px; font-weight: 700; }
  .empty { text-align: center; color: var(--muted); padding: 36px 16px; border: 1px dashed var(--line); border-radius: 12px; }
  .actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text);
    padding: 20px; width: min(480px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 14px; font-size: 19px; }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  input, select, textarea { display: block; width: 100%; margin-top: 4px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
  textarea { min-height: 70px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .foot { margin-top: 30px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 13px; }
  @media (max-width: 560px) {
    .row { flex-direction: column; align-items: stretch; padding: 0 0 8px; }
    .actions { padding: 0 12px; justify-content: flex-start; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="#/">DGUV <span>V3</span> Prüfungen</a>
      <button class="small" id="cloudBtn">☁ Cloud</button>
      <button class="small" id="lockBtn" title="App sofort sperren">🔒 Sperren</button>
    </div>
    <nav class="crumbs" id="crumbs"></nav>
  </div>
</header>
<div class="wrap"><main id="app"></main></div>
<footer class="bottom"><div class="wrap" id="bottom"></div></footer>
<dialog id="dlg"></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="fotoFile" accept="image/*" multiple hidden>

<script src="app.js"></script>
</body>
</html>
